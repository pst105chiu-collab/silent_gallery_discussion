<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>無聲筆談 Silent Gallery Walk｜萬用閱讀思辨討論板</title>
  <!-- 載入穩定版 Firebase v8 SDK (相容所有瀏覽器與 GitHub Pages) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg-main: #0f172a;
      --bg-card: #1e293b;
      --bg-card-soft: #263349;
      --bg-input: #0b1120;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --border: #334155;
      --tag-plus: #10b981;
      --tag-plus-bg: rgba(16, 185, 129, 0.15);
      --tag-q: #f59e0b;
      --tag-q-bg: rgba(245, 158, 11, 0.15);
      --tag-vs: #ef4444;
      --tag-vs-bg: rgba(239, 68, 68, 0.15);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background-color: var(--bg-main);
      color: var(--text-main);
      line-height: 1.6;
      min-height: 100vh;
      padding-bottom: 60px;
    }

    button {
      cursor: pointer;
      font-family: inherit;
      border: none;
      border-radius: 8px;
      transition: all 0.2s ease;
    }

    input, textarea, select {
      font-family: inherit;
      background: var(--bg-input);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.95rem;
      width: 100%;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* 頁首區 */
    header {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border-bottom: 1px solid var(--border);
      padding: 18px 20px;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    .header-inner {
      max-width: 1040px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    .book-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .book-cover-box {
      width: 52px;
      height: 72px;
      border-radius: 6px;
      background: linear-gradient(145deg, #334155, #1e293b);
      border: 1px solid #475569;
      box-shadow: -3px 3px 8px rgba(0,0,0,0.5), inset 3px 0 4px rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      font-size: 1.5rem;
    }
    .book-cover-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .title-group h1 {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f8fafc;
    }
    .title-group p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .conn-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: rgba(148, 163, 184, 0.15);
      color: #cbd5e1;
      border: 1px solid var(--border);
    }
    .conn-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .conn-badge.online {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.4);
    }
    .conn-badge.online .conn-dot {
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
    }
    .conn-badge.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border-color: rgba(239, 68, 68, 0.4);
    }
    .conn-badge.error .conn-dot { background: #ef4444; }

    .user-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--bg-card-soft);
      border: 1px solid var(--border);
      font-size: 0.85rem;
      color: #e2e8f0;
    }
    .btn-admin {
      background: #334155;
      color: #f8fafc;
      padding: 7px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border: 1px solid #475569;
    }
    .btn-admin:hover { background: #475569; }

    /* 主容器 */
    .container {
      max-width: 1040px;
      margin: 24px auto;
      padding: 0 18px;
    }

    /* 凍結橫幅 */
    .lock-banner {
      display: none;
      background: rgba(239, 68, 68, 0.18);
      border: 1px solid #ef4444;
      color: #fca5a5;
      padding: 12px 16px;
      border-radius: var(--radius);
      margin-bottom: 18px;
      text-align: center;
      font-weight: 600;
    }
    .lock-banner.active { display: block; }

    /* 海報分頁 Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .tab-btn {
      padding: 11px 18px;
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
      font-size: 0.95rem;
      font-weight: 600;
      border-radius: 10px;
    }
    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      box-shadow: 0 4px 14px rgba(56, 189, 248, 0.3);
    }

    /* 戰場問題卡 */
    .prompt-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-left: 5px solid var(--accent);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 22px;
    }
    .prompt-card h2 {
      font-size: 1.15rem;
      color: var(--accent);
      margin-bottom: 12px;
    }
    .question-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .question-list li {
      background: rgba(15, 23, 42, 0.55);
      padding: 12px 15px;
      border-radius: 8px;
      border: 1px solid rgba(51, 65, 85, 0.7);
      font-size: 0.98rem;
    }

    /* 立場尺規區 */
    .ruler-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      margin-bottom: 24px;
    }
    .ruler-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .ruler-header h3 {
      font-size: 1.05rem;
      color: #e2e8f0;
    }
    .polar-badge {
      display: none;
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid #ef4444;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .polar-badge.show { display: inline-block; }

    .ruler-statement {
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 12px 15px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-weight: 600;
      color: #bae6fd;
    }

    /* 光譜數線 */
    .spectrum-wrap {
      margin: 22px 0 14px;
      padding: 18px 14px 12px;
      background: var(--bg-input);
      border-radius: 10px;
      border: 1px solid var(--border);
    }
    .spectrum-bar {
      position: relative;
      height: 10px;
      background: linear-gradient(90deg, #38bdf8 0%, #94a3b8 50%, #f43f5e 100%);
      border-radius: 999px;
      margin: 26px 16px 14px;
    }
    .spectrum-ticks {
      display: flex;
      justify-content: space-between;
      margin: 0 12px;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
    .vote-dot {
      position: absolute;
      top: -9px;
      transform: translateX(-50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      border: 2px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      cursor: pointer;
    }
    .vote-dot:hover::after {
      content: attr(data-tip);
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #fff;
      padding: 5px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      white-space: nowrap;
      border: 1px solid var(--border);
      z-index: 20;
    }
    .ruler-labels {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      font-size: 0.84rem;
      color: var(--text-muted);
      margin-top: 8px;
    }
    .ruler-labels span:first-child { color: #7dd3fc; max-width: 48%; }
    .ruler-labels span:last-child { color: #fda4af; text-align: right; max-width: 48%; }

    .vote-form {
      display: grid;
      grid-template-columns: 140px 1fr auto;
      gap: 10px;
      align-items: center;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed var(--border);
    }
    @media (max-width: 680px) {
      .vote-form { grid-template-columns: 1fr; }
    }
    .score-display {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 0.85rem;
      font-weight: 600;
    }
    .btn-primary {
      background: var(--accent);
      color: #0f172a;
      padding: 10px 18px;
      font-weight: 700;
      font-size: 0.92rem;
    }
    .btn-primary:hover { background: #7dd3fc; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    /* 發表新觀點區 */
    .composer-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
    }
    .composer-card h3 {
      font-size: 1rem;
      margin-bottom: 10px;
      color: #e2e8f0;
    }
    .composer-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      gap: 10px;
      flex-wrap: wrap;
    }
    .symbol-guide {
      font-size: 0.82rem;
      color: var(--text-muted);
    }

    /* 篩選列 */
    .filter-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
      align-items: center;
    }
    .filter-btn {
      padding: 6px 12px;
      font-size: 0.84rem;
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .filter-btn.active {
      background: #334155;
      color: #fff;
      border-color: var(--accent);
    }

    /* 留言卡片 */
    .posts-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
    }
    .post-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      font-size: 0.85rem;
    }
    .author-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-weight: 700;
    }
    .avatar-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
    .post-body {
      font-size: 1rem;
      color: #f1f5f9;
      white-space: pre-wrap;
      margin-bottom: 14px;
    }
    .post-footer {
      display: flex;
      justify-content: flex-end;
    }
    .btn-reply-toggle {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 6px 12px;
      font-size: 0.84rem;
      font-weight: 600;
    }
    .btn-reply-toggle:hover { background: rgba(56, 189, 248, 0.22); }

    /* 巢狀回擊區 */
    .replies-box {
      margin-top: 14px;
      padding-left: 16px;
      border-left: 2px solid #334155;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .reply-item {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 8px;
      padding: 10px 14px;
    }
    .reply-head {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.82rem;
      flex-wrap: wrap;
    }
    .logic-badge {
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.78rem;
    }
    .logic-plus { background: var(--tag-plus-bg); color: var(--tag-plus); border: 1px solid var(--tag-plus); }
    .logic-q { background: var(--tag-q-bg); color: var(--tag-q); border: 1px solid var(--tag-q); }
    .logic-vs { background: var(--tag-vs-bg); color: var(--tag-vs); border: 1px solid var(--tag-vs); }

    /* 回擊輸入框 */
    .reply-composer {
      display: none;
      margin-top: 12px;
      background: var(--bg-input);
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .reply-composer.open { display: block; }
    .tag-selector {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .tag-option {
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.83rem;
      font-weight: 700;
      background: var(--bg-card);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .tag-option.selected[data-type="plus"] { background: var(--tag-plus-bg); color: var(--tag-plus); border-color: var(--tag-plus); }
    .tag-option.selected[data-type="q"] { background: var(--tag-q-bg); color: var(--tag-q); border-color: var(--tag-q); }
    .tag-option.selected[data-type="vs"] { background: var(--tag-vs-bg); color: var(--tag-vs); border-color: var(--tag-vs); }

    /* 彈窗 Modal */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.82);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      width: 100%;
      max-width: 680px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.6);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    .color-choices {
      display: flex;
      gap: 10px;
      margin: 10px 0 18px;
      flex-wrap: wrap;
    }
    .color-btn {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid transparent;
