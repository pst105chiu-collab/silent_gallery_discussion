        async function verifyTeacherCredentials(account, password) {
            const raw = `${account.trim()}:${password}`;
            if (window.crypto && window.crypto.subtle) {
                const msgBuffer = new TextEncoder().encode(raw);
                const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
                const hashArray = Array.from(new Uint8Array(hashBuffer));
                const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
                return hashHex === 'e75b528098229e6f63156896c003d00e14353619a8cf5c4ec4107b2efea4162c';
            }
            return account.trim() === 'admin' && password === '2803';
        }

            showToast('已清除封面預覽（需點擊儲存生效）', 'info');
        }

        function handleCoverFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            if (!file.type.startsWith('image/')) {
                showToast('請選擇圖片格式的檔案！', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    // 使用 Canvas 自動等比例縮放至最大寬度 240px（適合直立書封且確保雲端秒速同步）
                    const maxWidth = 240;
                    const scale = Math.min(1, maxWidth / img.width);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.round(img.width * scale);
                    canvas.height = Math.round(img.height * scale);
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                    tempCoverImage = canvas.toDataURL('image/jpeg', 0.8);
                    document.getElementById('editCoverUrlInput').value = '';
                    updateAdminCoverPreview(tempCoverImage);
                    showToast('書封圖片已最佳化壓縮完成！', 'success');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function showCustomDialog({ title, message, showCancel = true, onConfirm }) {
            const modal = document.getElementById('customDialogModal');
            document.getElementById('dialogTitle').textContent = title;
            document.getElementById('dialogMessage').textContent = message;

            const cancelBtn = document.getElementById('dialogCancelBtn');
            cancelBtn.style.display = showCancel ? 'inline-block' : 'none';

            const confirmBtn = document.getElementById('dialogConfirmBtn');
            const cleanup = () => modal.classList.add('hidden');

            cancelBtn.onclick = cleanup;
            confirmBtn.onclick = () => {
                cleanup();
                if (onConfirm) onConfirm();
            };

            modal.classList.remove('hidden');
